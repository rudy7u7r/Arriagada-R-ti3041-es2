<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Ferretería</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .filtro-container { background: #fff; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        input[type="text"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button, .btn-limpiar { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; }
        button { background-color: #2c3e50; color: white; }
        .btn-limpiar { background-color: #7f8c8d; color: white; display: inline-block; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Catálogo de Ferretería</h1>

    <form method="GET" class="filtro-container">
        <input type="text" name="q" placeholder="Buscar por nombre..." value="{{ query_nombre }}">

        <select name="categoria">
            <option value="">-- Todas las Categorías --</option>
            {% for cat in categorias %}
                <option value="{{ cat }}" {% if cat == categoria_filtro %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>

        <button type="submit">Buscar</button>
        <a href="{% url 'lista_productos' %}" class="btn-limpiar">Limpiar</a>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for producto in productos %}
            <tr>
                <td>{{ producto.id }}</td>
                <td>{{ producto.nombre }}</td>
                <td>{{ producto.categoria }}</td>
                <td>${{ producto.precio }}</td>
                <td>{{ producto.stock }} u.</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No se encontraron productos que coincidan con la búsqueda.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
