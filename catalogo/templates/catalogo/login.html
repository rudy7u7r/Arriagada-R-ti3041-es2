<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - La Ferretería Mordekaiser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f141a; color: #e1e6eb; font-family: 'Segoe UI', sans-serif; }
        .card-custom { background-color: #1a222d; border: 1px solid #00e5ff; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-4 shadow-lg">
                    <h3 class="text-center text-info fw-bold mb-4"><i class="bi bi-shield-lock me-2"></i>Iniciar Sesión</h3>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} text-center py-2">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-info">Nombre de usuario</label>
                            <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="Ingresa tu usuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-info">Contraseña</label>
                            <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="Ingresa tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-info w-100 fw-bold mt-3 text-dark">Ingresar</button>
                    </form>

                    <div class="text-center mt-3">
                        <small>¿No tienes cuenta? <a href="{% url 'register' %}" class="text-info">Regístrate aquí</a></small><br>
                        <small><a href="{% url 'lista_productos' %}" class="text-secondary mt-2 d-inline-block">Volver a la tienda</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
